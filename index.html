<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4A3F45">
  <title>Iman & Danial Wedding Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">I&D</div>
        <div>
          <strong>IMAN & DANIAL</strong>
          <span>Wedding Planner</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-page="dashboard">⌂ <span>Dashboard</span></button>
        <button class="nav-item" data-page="timeline">☑ <span>Timeline</span></button>
        <button class="nav-item" data-page="budget">RM <span>Budget</span></button>
        <button class="nav-item" data-page="tunang">♡ <span>Tunang</span></button>
        <button class="nav-item" data-page="nikah">♡ <span>Nikah + Resepsi</span></button>
        <button class="nav-item" data-page="guests">♙ <span>Guest List</span></button>
        <button class="nav-item" data-page="legal">▣ <span>Legal</span></button>
        <button class="nav-item" data-page="prep">✦ <span>Personal Prep</span></button>
        <button class="nav-item" data-page="inspo">▧ <span>Inspiration</span></button>
      </nav>

      <div class="sidebar-note">
        <span>VIEW MODE</span>
        <p>Parents can view the planner without needing an account.</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div>
          <p class="eyebrow">OUR WEDDING JOURNEY</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="mode-pill">VIEW ONLY</div>
      </header>

      <section id="app"></section>
    </main>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
